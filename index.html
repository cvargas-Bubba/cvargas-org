<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Índice de aplicaciones de cvargas.org">
<title>cvargas.org</title>
<meta name="theme-color" content="#14110F">
<meta name="robots" content="noindex">
<link rel="icon" href="marca/fv-monograma.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="indice.css?v=20261102c">
<style>[hidden]{display:none!important}</style>
</head>
<body>

<header class="cab">
  <div class="cab-in">
    <a class="sitio" href="./">cvargas<span>.org</span></a>
    <div class="sesion">
      <span class="sesion-q" id="sesionQuien" hidden></span>
      <button class="btn btn-linea" id="btnSesion">Entrar</button>
    </div>
  </div>
</header>

<main class="hoja">
  <ul class="tarjetas" id="tarjetas"></ul>
  <p class="nota" id="nota" hidden></p>

  <section class="otras" id="otrasSec" hidden>
    <h2 class="rotulo">Otras herramientas</h2>
    <ul class="enlaces" id="otras"></ul>
  </section>
</main>

<div class="acceso" id="acceso" hidden>
  <form class="acceso-card" id="accesoForm">
    <h1 class="acceso-t">Entrar</h1>
    <p class="acceso-h">Con tu correo y contraseña se abren las aplicaciones privadas.</p>
    <label for="acCorreo">Correo</label>
    <input class="campo" id="acCorreo" type="email" autocomplete="username" spellcheck="false">
    <label for="acClave">Contraseña</label>
    <input class="campo" id="acClave" type="password" autocomplete="current-password">
    <p class="acceso-aviso" id="accesoAviso" hidden></p>
    <button class="btn btn-lleno" type="submit" id="acEntrar">Entrar</button>
    <div class="acceso-pie">
      <button type="button" class="enlace" id="acOlvide">Olvidé mi contraseña</button>
      <button type="button" class="enlace" id="acCerrar">Cancelar</button>
    </div>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="muebles/nube.js?v=20261102c"></script>
<script src="indice.js?v=20261102c"></script>
<script src="registro.js?v=20261102c" data-app="indice"></script>
</body>
</html>
